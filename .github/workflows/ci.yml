# One workflow, five jobs. See docs/2026-08-16-platform-config-playbook.md §2.3.
# 1. changes        - which half changed
# 2. backend        - Gradle tests with a Mongo service container
# 3. frontend       - unit tests, production build, e2e, artifact upload
# 4. deploy-frontend - upload the tested artifact to Cloudflare Pages (master only)
# 5. deploy-backend  - flyctl deploy --remote-only (master only)
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew test --no-daemon
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          if-no-files-found: error

  deploy-frontend:
    needs: [changes, backend, frontend]
    if: >-
      ${{ !cancelled()
          && github.ref == 'refs/heads/master'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && needs.frontend.result == 'success'
          && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Own group. cancel-in-progress is false, so a run in progress always finishes.
    # A newer queued run can still replace an older pending run in the same group.
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # The artifact lands in the same place the local build writes it. Wrangler
      # then runs from frontend/, which is the only directory that holds
      # functions/ and _routes.json. Wrangler reads both from its working
      # directory, not from the asset directory. A deploy from the repository
      # root finds neither, and the /r/<slug> route silently disappears.
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
      - name: Reject a placeholder API origin
        run: |
          if grep -rq 'REPLACE_ME_DOMAIN' frontend/dist/frontend/browser; then
            echo "The build still contains REPLACE_ME_DOMAIN. Set the domain in environment.production.ts."
            exit 1
          fi
      - name: Check the Pages Function is present
        run: |
          test -f 'frontend/functions/r/[slug].js' || {
            echo "frontend/functions/r/[slug].js is missing. The /r/<slug> result page would not deploy."
            exit 1
          }
          test -f frontend/_routes.json || {
            echo "frontend/_routes.json is missing. Every request would invoke the Function."
            exit 1
          }
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist/frontend/browser --project-name=geostrategy --branch=master
      # Proves the Pages Function reached production. A deploy that drops it still
      # answers 200 on every static page, so only this check finds the fault.
      # The unknown slug must return the Function's own page, not the static 404.
      - name: Smoke test the /r/ result route
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sS --max-time 20 https://traficio.com/r/ci-probe-unknown-slug || true)
            case "$body" in
              *"Result not found"*)
                echo "The /r/ Function answers. Attempt $attempt."
                exit 0
                ;;
            esac
            echo "Attempt $attempt: the /r/ route did not answer from the Function. Waiting."
            sleep 10
          done
          echo "The /r/<slug> route does not run the Pages Function."
          echo "Check that wrangler ran from frontend/, the one directory with functions/ and _routes.json."
          exit 1

  deploy-backend:
    needs: [changes, backend, frontend]
    if: >-
      ${{ !cancelled()
          && github.ref == 'refs/heads/master'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && needs.backend.result == 'success'
          && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --remote-only
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
